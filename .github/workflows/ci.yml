name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: finn
          POSTGRES_PASSWORD: finn
          POSTGRES_DB: finn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://finn:finn@localhost:5432/finn_test?schema=public
      TEST_DATABASE_URL: postgresql://finn:finn@localhost:5432/finn_test?schema=public
      JWT_SECRET: chave-usada-somente-na-integracao-continua
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t finn-api .
      - run: docker build --target migrate -t finn-migrate .
      - run: docker build -t finn-web ./frontend

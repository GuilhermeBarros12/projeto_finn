limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend e API na mesma origem: é o que permite o cookie SameSite=Strict.
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # A exportação é enviada aos poucos; sem isto o nginx tentaria acumular o arquivo.
        proxy_buffering off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
